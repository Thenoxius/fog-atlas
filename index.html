<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fully local fog-of-war map tool for dungeon masters. Import battle maps, prepare fog of war, and reveal it live at the table — no accounts, no cloud." />
    <meta name="theme-color" content="#efe4c6" />
    <!-- Link previews (Reddit, Discord, chat apps). Absolute URLs: scrapers
         don't resolve relative paths against the deployed origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fog Atlas" />
    <meta property="og:title" content="Fog Atlas — fog of war for your table" />
    <meta property="og:description" content="Free, fully local fog-of-war tool for dungeon masters. No accounts, no cloud — your maps never leave your device." />
    <meta property="og:url" content="https://fog-atlas.com/" />
    <meta property="og:image" content="https://fog-atlas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Fog Atlas — DM Map Manager</title>
  </head>
  <body>
    <!-- Apply the stored theme before first paint (Atlas needs no attribute) -->
    <script>
      try {
        var t = localStorage.getItem('fog-atlas-theme');
        if (t && t !== 'atlas') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
