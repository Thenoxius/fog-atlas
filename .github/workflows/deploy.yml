# Staging deploy: every push to main builds the app and publishes it to
# GitHub Pages. The deployed app is still fully local-first — all map data
# stays in the visitor's own browser (IndexedDB); Pages only serves the
# static files. The bundled map collection lives in the separate
# fog-atlas-collection repo and is checked out into public/collection/
# before the build (see also scripts/fetch-collection.mjs for local dev).
# The weekly schedule exists so maps added to fog-atlas-collection reach the
# live site even on a week with no app-repo commits — that repo's own pushes
# don't trigger this workflow, only pushes here or workflow_dispatch do.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Thenoxius/fog-atlas-collection
          path: fog-atlas-collection
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p public/collection && cp -r fog-atlas-collection/collection/. public/collection/
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
